<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Engineering GPU Cluster</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color-scheme:dark;background:#101826;color:#edf2fa}body{max-width:1150px;margin:25px auto;padding:0 18px}h1{font-size:1.8rem;margin-bottom:4px}p{color:#aebcd0}.pane{background:#1b283b;border:1px solid #34445e;border-radius:12px;padding:18px;margin:18px 0}input,select,button{background:#111c2d;color:white;border:1px solid #53627b;border-radius:7px;padding:10px;margin:3px}button{background:#2563eb;cursor:pointer}button:hover{background:#1d4ed8}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #34445e;padding:9px;font-size:13px}th{color:#aebcd0}form{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.ok{color:#54d6a0}.err{color:#f5a6a6}code{color:#addaff}.muted{color:#aebcd0}</style></head><body>
<h1>AI Engineering · GPU Cluster</h1><p>Management server · live worker heartbeats and queued training jobs</p>
<section class="pane"><label>API key <input id="key" type="password" placeholder="Enter API_KEY" size="36"></label><button onclick="refresh()">Connect / Refresh</button><span class="muted">Key is kept in this browser tab's memory only.</span><div id="notice"></div></section>
<section class="pane"><h2>GPU workers</h2><div id="nodes">Connect to see workers.</div></section>
<section class="pane"><h2>Submit job</h2><form onsubmit="submitJob(event)"><input name="student_id" placeholder="Student ID" value="C001" required><select name="mode"><option value="smoke">GPU smoke test</option><option value="train">YOLO training</option></select><input name="dataset" value="dates-v16" size="12"><select name="model"><option>yolo26n.pt</option><option>yolo26s.pt</option></select><label>Epochs <input name="epochs" type="number" min="1" max="200" value="3" style="width:58px"></label><label>Image <select name="imgsz"><option>320</option><option>416</option><option selected>512</option><option>640</option></select></label><label>Batch <input name="batch" type="number" min="1" max="8" value="4" style="width:55px"></label><button type="submit">Submit</button></form></section>
<section class="pane"><h2>Recent jobs</h2><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Student</th><th>Mode</th><th>Model</th><th>Status</th><th>Worker</th><th>Artifacts</th></tr></thead><tbody id="jobs"></tbody></table></div></section>
<script>let apiKey='';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function call(path,options={}){apiKey=$('key').value||apiKey;if(!apiKey)throw Error('Enter API key');let r=await fetch(path,{...options,headers:{'x-api-key':apiKey,...(options.headers||{})}});if(!r.ok)throw Error(r.status+' '+await r.text());return r.json()}
async function refresh(){try{const [n,j]=await Promise.all([call('/nodes'),call('/jobs')]);$('notice').textContent='Connected · '+new Date().toLocaleTimeString();$('notice').className='ok';$('nodes').innerHTML=n.length?'<table><tr><th>Node</th><th>GPU</th><th>VRAM free/total</th><th>Utilization</th><th>Job</th><th>Heartbeat age</th></tr>'+n.map(x=>'<tr><td>'+esc(x.node)+'</td><td>'+esc(x.gpu?.name||'Unknown')+'</td><td>'+esc(x.gpu?.free_mib)+' / '+esc(x.gpu?.total_mib)+' MiB</td><td>'+esc(x.gpu?.utilization_pct)+'%</td><td>'+esc(x.current_job||'Idle')+'</td><td>'+Math.round(Date.now()/1000-x.last_seen)+'s</td></tr>').join('')+'</table>':'No active workers';$('jobs').innerHTML=j.map(x=>'<tr><td><code>'+esc(x.id.slice(0,10))+'</code></td><td>'+esc(x.student_id)+'</td><td>'+esc(x.mode)+'</td><td>'+esc(x.model)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.node||'—')+'</td><td>'+(x.artifact?'<button data-id="'+esc(x.id)+'" onclick="downloadJob(this.dataset.id)">Download</button>':'—')+'</td></tr>').join('')}catch(e){$('notice').textContent=e.message;$('notice').className='err'}}
async function submitJob(e){e.preventDefault();const f=new FormData(e.target);let data=Object.fromEntries(f.entries());for(const k of ['epochs','imgsz','batch'])data[k]=Number(data[k]);try{await call('/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});await refresh()}catch(e){alert(e.message)}}
async function downloadJob(id){try{const r=await fetch('/jobs/'+id+'/artifact',{headers:{'x-api-key':apiKey}});if(!r.ok)throw Error(await r.text());let blob=await r.blob();let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=id+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){alert(e.message)}}setInterval(()=>{if(apiKey)refresh()},5000)</script></body></html>
